# Builds and tests every push / pull request; a "v*" tag publishes signed APKs (arm64-v8a, armeabi-v7a)
# as a GitHub release (the app's update check reads those releases).
name: Android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests of every module that has them: the Android modules (app, host-android) run
      # testDebugUnitTest, the JVM modules (extensions, api-spotify, host-cdp) run test.
      # The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew :host-android:testDebugUnitTest :extensions:test :api-spotify:test :host-cdp:test

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug -x :app:testDebugUnitTest

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: myspoti-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for a beta's notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Strict semver tags, so Obtainium and the app compare versions right: "v2.2.1-beta.1" (a beta
      # of the next version, above the last stable) or "v2.2.1". See tools/check_tag.py.
      - name: Tag format
        working-directory: .
        run: python3 tools/check_tag.py "$GITHUB_REF_NAME"

      # The release key rotates from the historical debug key through APK Signature Scheme v3.
      # All three files must stay together, otherwise installed builds cannot update.
      - name: Signing material
        env:
          DEBUG_KEYSTORE: ${{ secrets.REVERA_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ secrets.REVERA_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.REVERA_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.REVERA_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.REVERA_RELEASE_KEY_PASSWORD }}
          SIGNING_LINEAGE: ${{ secrets.REVERA_SIGNING_LINEAGE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE" || { echo "::error::REVERA_DEBUG_KEYSTORE_BASE64 secret missing"; exit 1; }
          test -n "$RELEASE_KEYSTORE" || { echo "::error::REVERA_RELEASE_KEYSTORE_BASE64 secret missing"; exit 1; }
          test -n "$RELEASE_PASSWORD" || { echo "::error::REVERA_RELEASE_KEYSTORE_PASSWORD secret missing"; exit 1; }
          test -n "$RELEASE_ALIAS" || { echo "::error::REVERA_RELEASE_KEY_ALIAS secret missing"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "::error::REVERA_RELEASE_KEY_PASSWORD secret missing"; exit 1; }
          test -n "$SIGNING_LINEAGE" || { echo "::error::REVERA_SIGNING_LINEAGE_BASE64 secret missing"; exit 1; }
          mkdir -p keystore
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > keystore/debug.keystore
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > keystore/release.keystore
          printf '%s' "$SIGNING_LINEAGE" | base64 --decode > keystore/lineage.bin
          {
            echo 'storeFile=release.keystore'
            echo "storePassword=$RELEASE_PASSWORD"
            echo "keyAlias=$RELEASE_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
            echo 'lineageFile=lineage.bin'
          } > keystore/keystore.properties
          chmod 600 keystore/*

      - name: Release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # One build, every APK (ABI splits), same versionCode, named by :app:collectApks:
          # Revera-<version>-ARMv8.apk, -ARMv7.apk, -universal.apk, -TV.apk (betas: Revera-Beta-...).
          # The app's update check picks this phone's one (UpdateChecker.apkAsset).
          ./gradlew assembleRelease :app:collectApks \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PupdateRepo="$GITHUB_REPOSITORY"

      - name: Verify release APKs
        run: |
          for apk in app/build/release-apks/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='app.revera.dev'"
          done

      # This version's section of CHANGELOG.md becomes the release description.
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          # A beta without its own section: the CHANGELOG lines added since the previous tag,
          # else (first beta) the section of the version it leads to.
          PREVIOUS="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ ! -s release-notes.md ] && [ "$VERSION" != "${VERSION%%-*}" ] && [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$GITHUB_REF_NAME" -- ../CHANGELOG.md | grep '^+- ' | sed 's/^+//' > release-notes.md || true
          fi
          [ -s release-notes.md ] || awk -v v="${VERSION%%-*}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See the commits since the previous release." > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: base/app/build/release-apks/*.apk
          body_path: base/release-notes.md
          generate_release_notes: true
          # "v2.0.0-beta.1": a pre-release, offered only to beta builds.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Announces the release on Discord (secret DISCORD_WEBHOOK_URL; nothing posted without it).
      # A release created with GITHUB_TOKEN triggers no other workflow, hence this step here.
      - name: Discord announcement
        continue-on-error: true
        working-directory: .
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discord_release.py "$GITHUB_REF_NAME"
